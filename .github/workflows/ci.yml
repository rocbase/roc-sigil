# Draft CI for rocbase/roc-sigil — NOT committed. Place at .github/workflows/ci.yml after review.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pipeline smoke run (writes to .smoke-output/, not output/)
        run: npm run smoke
      - name: Ensure committed output/ was not modified
        run: git diff --exit-code -- output/
